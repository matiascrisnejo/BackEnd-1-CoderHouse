                  date: "1990-01-23"
                  email: "matt@coder.ar"
                  password: "hola1234"
                  avatar: "https://example.com/avatar.jpg"
                  rol: "ADMIN"
        400:
          description: Falta algún dato para actualizar el usuarios.
          content:
