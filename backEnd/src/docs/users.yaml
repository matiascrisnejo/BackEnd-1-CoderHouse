      summary: Elimina un usuario por su ID.
      tags:
        - Users
      description: Elimina un usuario específico utilizando su ID.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID del usuario a eliminar.
      security:
        - cookieAuth: []
      responses:
        200:
          description: Usuario eliminado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Método utilizado.
                    type: string
