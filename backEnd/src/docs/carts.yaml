components:
  schemas:
    Cart:
      type: object
      properties:
        product_id:
          description: Id del producto
          type: string
        user_id:
          description: Id del usuario del Carrito
          type: string
        quantity:
          description: Cantidad del producto a agregar
          type: number
        state:
          description: Estado del producto
          type: string
      example:
        product_id: "123456789"
        user_id: "987654321"
        quantity: 2
        state: "available"
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
responses:
  error400:
    type: object
    properties:
      method:
        description: Metodo con el cual se realizó la solicitud
        type: string
      url:
        description: Ruta a la cual se realizó la solicitud
        type: string
      error:
        description: Mensaje de error de la operación
        type: string
    example:
      method: post
      url: /api/carts
      error: Invalid data
  error401:
    type: object
    properties:
      method:
        description: Metodo con el cual se realizó la solicitud
        type: string
      url:
        description: Ruta a la cual se realizó la solicitud
        type: string
      error:
        description: Mensaje de error de la operación
        type: string
    example:
      method: post
      url: /api/carts
      error: Invalid credentials
  error403:
    type: object
    properties:
      method:
        description: Metodo con el cual se realizó la solicitud
        type: string
      url:
        description: Ruta a la cual se realizó la solicitud
        type: string
      error:
        description: Mensaje de error de la operación
        type: string
    example:
      method: post
      url: /api/carts
      error: Forbidden
  error500:
    type: object
    properties:
      method:
        description: Metodo con el cual se realizó la solicitud
        type: string
      url:
        description: Ruta a la cual se realizó la solicitud
        type: string
      error:
        description: Mensaje de error de la operación
        type: string
    example:
      method: post
      url: /api/carts
      error: Fatal error    

paths:
  /api/carts:
    post:
      summary: Crea un carrito en la base de datos
      tags:
        - Cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cart'
      security:
        - cookieAuth: []
      responses:
        200:
          description: Creación de carrito exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Metodo con el cual se realizó la solicitud
                    type: string
                  url:
                    description: Ruta a la cual se realizó la solicitud
                    type: string
                  response:
                    description: Mensaje de éxito de la operación
                    type: string
                example:
                  product_id: "123456789"
                  user_id: "987654321"
                  quantity: 2
                  state: "available"

        400:
          description: Falta algún dato válido para la creación del carrito
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Método usado
                    type: string
                  url:
                    description: Ruta solicitada
                    type: string
                  error:
                    description: Descripción del error
                    type: string
                example:
                  method: post
                  url: /api/carts
                  error: Invalid data
        401:
          description: Credenciales inválidas para la creación del carrito
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Método usado
                    type: string
                  url:
                    description: Ruta solicitada
                    type: string
                  error:
                    description: Descripción del error
                    type: string
                example:
                  method: post
                  url: /api/carts
                  error: Invalid credentials
        500:
          description: Error del lado del servidor al crear el carrito
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Método usado
                    type: string
                  url:
                    description: Ruta solicitada
                    type: string
                  error:
                    description: Descripción del error
                    type: string
                example:
                  method: post
                  url: /api/carts
                  error: Fatal error
    get:
      summary: Obtiene todos los carritos de la base de datos
      tags:
        - Cart
      responses:
        200:
          description: Se observan todos los carritos de la base de datos
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Metodo con el cual se realizó la solicitud
                    type: string
                  url:
                    description: Ruta a la cual se realizó la solicitud
                    type: string
                  response:
                    description: Mensaje de éxito de la operación
                    type: string
                example:
                  product_id: "123456789"
                  user_id: "987654321"
                  quantity: 2
                  state: "available"

        400:
          description: Falta algún dato válido para visualizar los carritos
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Método usado
                    type: string
                  url:
                    description: Ruta solicitada
                    type: string
                  error:
                    description: Descripción del error
                    type: string
                example:
                  method: get
                  url: /api/carts
                  error: Invalid data
        401:
          description: Credenciales inválidas para la consulta de los carritos
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Método usado
                    type: string
                  url:
                    description: Ruta solicitada
                    type: string
                  error:
                    description: Descripción del error
                    type: string
                example:
                  method: get
                  url: /api/carts
                  error: Invalid credentials
        500:
          description: Error del lado del servidor al consultar los carritos
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Método usado
                    type: string
                  url:
                    description: Ruta solicitada
                    type: string
                  error:
                    description: Descripción del error
                    type: string
                example:
                  method: get
                  url: /api/carts
                  error: Fatal error
  /api/carts/{id}:
    put:
      summary: Actualiza un carrito de la base de datos
      tags:
        - Cart
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  description: Id del producto
                  type: string
                user_id:
                  description: Id del usuario del Carrito
                  type: string
                quantity:
                  description: Cantidad del producto a agregar
                  type: number
                state:
                  description: Estado del producto
                  type: string
              example:
                product_id: "123456788"
                user_id: "987654322"
                quantity: 3
                state: "available"
      security:
        - cookieAuth: []
      responses:
        200:
          description: Actualización de carrito exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Metodo con el cual se realizó la solicitud
                    type: string
                  url:
                    description: Ruta a la cual se realizó la solicitud
                    type: string
                  response:
                    description: Mensaje de éxito de la operación
                    type: string
                example:
                  product_id: "123456789"
                  user_id: "987654321"
                  quantity: 2
                  state: "available"

        400:
          description: Falta algún dato válido para la actualización del carrito
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Método usado
                    type: string
                  url:
                    description: Ruta solicitada
                    type: string
                  error:
                    description: Descripción del error
                    type: string
                example:
                  method: put
                  url: /api/carts
                  error: Invalid data
        401:
          description: Credenciales inválidas para la actualización del carrito
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Método usado
                    type: string
                  url:
                    description: Ruta solicitada
                    type: string
                  error:
                    description: Descripción del error
                    type: string
                example:
                  method: put
                  url: /api/carts
                  error: Invalid credentials
        500:
          description: Error del lado del servidor al actualizar el carrito
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Método usado
                    type: string
                  url:
                    description: Ruta solicitada
                    type: string
                  error:
                    description: Descripción del error
                    type: string
                example:
                  method: put
                  url: /api/carts
                  error: Fatal error
    delete:
      summary: Elimina un carrito de la base de datos 
      tags:
        - Cart
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - cookieAuth: []
      responses:
        200:
          description: Eliminación de carrito exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Metodo con el cual se realizó la solicitud
                    type: string
                  url:
                    description: Ruta a la cual se realizó la solicitud
                    type: string
                  response:
                    description: Mensaje de éxito de la operación
                    type: string
                example:
                  product_id: "123456789"
                  user_id: "987654381"
                  quantity: 2
                  state: "available"

        400:
          description: Falta algún dato válido para la Eliminación del carrito
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Método usado
                    type: string
                  url:
                    description: Ruta solicitada
                    type: string
                  error:
                    description: Descripción del error
                    type: string
                example:
                  method: delete
                  url: /api/carts
                  error: Invalid data
        401:
          description: Credenciales inválidas para la Eliminación del carrito
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Método usado
                    type: string
                  url:
                    description: Ruta solicitada
                    type: string
                  error:
                    description: Descripción del error
                    type: string
                example:
                  method: delete
                  url: /api/carts
                  error: Invalid credentials
        500:
          description: Error del lado del servidor al Eliminar el carrito
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Método usado
                    type: string
                  url:
                    description: Ruta solicitada
                    type: string
                  error:
                    description: Descripción del error
                    type: string
                example:
                  method: delete
                  url: /api/carts
                  error: Fatal error
      
      
  /api/carts/{id}/{state}:
    put:
      summary: Cambia el estado del carrito de la base de datos
      tags:
        - Cart
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  description: Estado del producto a actualizar
                  type: string
              example:
                state: "reserved"
      security:
        - cookieAuth: []
      responses:
        200:
          description: Actualización del estado del carrito exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Metodo con el cual se realizó la solicitud
                    type: string
                  url:
                    description: Ruta a la cual se realizó la solicitud
                    type: string
                  response:
                    description: Mensaje de éxito de la operación
                    type: string
                example:
                  product_id: "123456789"
                  user_id: "987654321"
                  quantity: 2
                  state: "available"

        400:
          description: Falta algún dato válido para la actualización del estado del carrito
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Método usado
                    type: string
                  url:
                    description: Ruta solicitada
                    type: string
                  error:
                    description: Descripción del error
                    type: string
                example:
                  method: put
                  url: /api/carts
                  error: Invalid data
        401:
          description: Credenciales inválidas para la actualización del estado del carrito
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Método usado
                    type: string
                  url:
                    description: Ruta solicitada
                    type: string
                  error:
                    description: Descripción del error
                    type: string
                example:
                  method: put
                  url: /api/carts
                  error: Invalid credentials
        500:
          description: Error del lado del servidor al actualizar el estado del carrito
          content:
            application/json:
              schema:
                type: object
                properties:
                  method:
                    description: Método usado
                    type: string
                  url:
                    description: Ruta solicitada
                    type: string
                  error:
                    description: Descripción del error
                    type: string
                example:
                  method: put
                  url: /api/carts
                  error: Fatal error
