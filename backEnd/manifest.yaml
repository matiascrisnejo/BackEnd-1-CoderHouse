#version de la api de kubernetes, tipo de recurso a crear y nombre del deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codercommerce
#especificaciones del deployment
spec:
  replicas: 10
  selector:
    matchLabels:
      app: codercommerce
  template:
    metadata:
      labels:
        app: codercommerce
    spec:
      containers:
        - name: codercommerce
          image: matycris/coderserver1.0.0
          ports:
            - containerPort: 8080
---  
#version de la api de kubernetes, tipo de recurso a crear y nombre del service
apiVersion: v1
kind: Service
metadata:
  name: codercommerce-service
spec:
  type: NodePort
  selector:
    app: codercommerce
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30003

      